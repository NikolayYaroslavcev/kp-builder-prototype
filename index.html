<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Сборка КП — прототип</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand">Сборка КП <span class="tag">прототип, данные условные</span></div>
  <label class="deal">Сделка Битрикс24
    <select id="deal"></select>
  </label>
  <div id="dealInfo" class="muted"></div>
</header>

<main class="grid">
  <section class="panel">
    <h2>Каталог PIM</h2>
    <div class="row">
      <input id="q" type="search" placeholder="Артикул или название">
      <select id="cat"><option value="">Все категории</option></select>
    </div>
    <table class="list">
      <thead><tr><th>Артикул</th><th>Товар</th><th class="num">Цена, ₽</th><th></th></tr></thead>
      <tbody id="catalog"></tbody>
    </table>
    <div class="pager"><button id="prev">←</button><span id="pageInfo"></span><button id="next">→</button></div>

    <details class="bulk">
      <summary>Вставить список артикулов из запроса клиента</summary>
      <textarea id="bulkText" rows="4" placeholder="LIFT-0001 2&#10;COMP-0048&#10;ACC-0092 4"></textarea>
      <button id="bulkAdd">Добавить в КП</button>
      <div id="bulkResult" class="muted"></div>
    </details>
  </section>

  <section class="panel">
    <h2>КП по сделке <span id="kpNo" class="muted"></span></h2>
    <table class="list kp">
      <thead><tr><th>Товар</th><th class="num">Кол-во</th><th class="num">Цена</th><th class="num">Скидка, %</th><th class="num">Сумма</th><th></th></tr></thead>
      <tbody id="lines"></tbody>
    </table>
    <div id="totals" class="totals"></div>
    <h3>Проверки</h3>
    <ul id="checks" class="checks"></ul>
    <div class="row actions">
      <button id="preview" class="primary">Предпросмотр и PDF</button>
      <button id="attach">Сохранить в сделку</button>
      <button id="clear" class="ghost">Очистить</button>
    </div>
    <pre id="attachLog" class="log" hidden></pre>
  </section>
</main>

<dialog id="doc">
  <div id="docBody" class="kpdoc"></div>
  <div class="row noprint"><button id="print" class="primary">Печать / сохранить PDF</button><button id="closeDoc">Закрыть</button></div>
</dialog>

<script type="module" src="app.js"></script>
</body>
</html>
